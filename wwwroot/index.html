
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chudisoft Interval Timer</title>
    <base href="/" />

    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Chudisoft Interval Timer.styles.css" />
    <link rel="icon" href="data:," />

    <meta name="theme-color" content="#071522" />
</head>

<body>
    <div class="status-bar-safe-area"></div>
    <div id="app" aria-live="polite">
        <div class="app-loader">
            <div class="loader-ring"></div>
            <div class="loader-brand">CHUDISOFT</div>
            <div class="loader-text">Preparing your timer</div>
            <div class="loader-subtext">Getting things ready...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        <span>An unexpected error occurred.</span>
        <a href="." class="reload">Reload application</a>
        <button class="dismiss" aria-label="Dismiss error">×</button>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
